<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page under construction</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --concrete: #e4e1da;
    --steel: #1f2733;
    --yellow: #ffc20e;
    --rust: #b8512b;
    --ink: #1f2733;
    --muted: #55606e;
    --display: "Barlow Condensed", "Arial Narrow", Impact, sans-serif;
    --body: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --concrete: #171c24;
      --ink: #f1eee8;
      --muted: #a4adb9;
      --steel: #e4e1da;
    }
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    background: var(--concrete);
    color: var(--ink);
    font-family: var(--body);
    font-size: clamp(1rem, 0.95rem + 0.3vw, 1.15rem);
    line-height: 1.6;
  }

  /* Hazard tape */
  .tape {
    height: clamp(18px, 3vw, 30px);
    background: repeating-linear-gradient(-45deg, var(--yellow) 0 22px, #14181f 22px 44px);
    flex-shrink: 0;
  }

  main {
    flex: 1;
    width: 100%;
    max-width: 1180px;
    margin: 0 auto;
    padding: clamp(1.5rem, 5vw, 4rem) clamp(1.25rem, 5vw, 3rem);
    display: grid;
    grid-template-columns: 1.1fr 0.9fr;
    gap: clamp(1.5rem, 5vw, 4rem);
    align-items: center;
  }

  h1 {
    font-family: var(--display);
    font-weight: 800;
    font-size: clamp(3rem, 10vw, 7rem);
    line-height: 0.92;
    letter-spacing: -0.01em;
    margin: 0 0 1.25rem;
  }
  h1 span {
    display: inline-block;
    background: var(--yellow);
    color: #14181f;
    padding: 0 0.15em;
    transform: rotate(-1.5deg);
  }
  .lead {
    max-width: 34rem;
    color: var(--muted);
    margin: 0 0 2rem;
  }

  /* Progress */
  .progress { max-width: 30rem; margin-bottom: 2rem; }
  .progress-head {
    display: flex;
    justify-content: space-between;
    font-family: var(--display);
    font-weight: 600;
    font-size: 1.15rem;
    margin-bottom: 0.4rem;
  }
  .bar {
    height: 14px;
    border: 2px solid var(--steel);
    padding: 2px;
  }
  .bar i {
    display: block;
    height: 100%;
    width: 72%;
    background: repeating-linear-gradient(-45deg, var(--yellow) 0 8px, #14181f 8px 16px);
    transform-origin: left;
    animation: fill 2.4s 0.4s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes fill { from { transform: scaleX(0); } }

  .actions { display: flex; flex-wrap: wrap; gap: 0.75rem; }
  .btn {
    display: inline-block;
    font-family: var(--display);
    font-weight: 800;
    font-size: 1.2rem;
    padding: 0.7rem 1.5rem;
    text-decoration: none;
    border: 2px solid var(--steel);
    color: var(--ink);
    transition: background 0.15s, color 0.15s;
  }
  .btn.primary { background: var(--yellow); color: #14181f; border-color: #14181f; }
  .btn:hover { background: var(--steel); color: var(--concrete); }
  .btn.primary:hover { background: #14181f; color: var(--yellow); }
  .btn:focus-visible { outline: 3px solid var(--rust); outline-offset: 3px; }

  /* Scene */
  .scene { width: 100%; max-width: 480px; justify-self: center; }
  .scene svg { width: 100%; height: auto; display: block; overflow: visible; }
  .line { stroke: var(--steel); stroke-width: 3; fill: none; stroke-linecap: square; }
  .floor { fill: var(--concrete); stroke: var(--steel); stroke-width: 3; }
  .win { fill: var(--steel); opacity: 0.85; }
  .crane { stroke: var(--yellow); stroke-width: 5; fill: none; }
  .crane-fill { fill: var(--yellow); stroke: #14181f; stroke-width: 2; }
  .ground { fill: #14181f; }

  .f { animation: rise 0.7s cubic-bezier(.3,1.3,.5,1) both; transform-box: fill-box; }
  .f1 { animation-delay: 0.3s; }
  .f2 { animation-delay: 0.7s; }
  .f3 { animation-delay: 1.1s; }
  .f4 { animation-delay: 1.5s; }
  .f5 { animation-delay: 1.9s; }
  @keyframes rise {
    from { transform: translateY(-60px); opacity: 0; }
    to   { transform: none; opacity: 1; }
  }
  .sway { transform-origin: 170px 44px; animation: sway 4s ease-in-out infinite alternate; }
  @keyframes sway {
    from { transform: rotate(-4deg); }
    to   { transform: rotate(4deg); }
  }

  footer {
    padding: 1.25rem clamp(1.25rem, 5vw, 3rem) 1.75rem;
    text-align: center;
    color: var(--muted);
    font-size: 0.95rem;
  }

  /* Tablet and phone */
  @media (max-width: 820px) {
    main { grid-template-columns: 1fr; text-align: center; }
    .lead, .progress { margin-left: auto; margin-right: auto; }
    .actions { justify-content: center; }
    .scene { order: -1; max-width: 340px; }
  }
  @media (max-width: 420px) {
    .btn { width: 100%; text-align: center; }
  }
  /* Large screens */
  @media (min-width: 1600px) {
    main { max-width: 1400px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
  <div class="tape" aria-hidden="true"></div>

  <main>
    <section>
      <h1>This page is <span>under construction</span></h1>
      <p class="lead">We're putting up the walls and wiring the lights. The site isn't ready yet, but it will be soon. Check back in a few days.</p>

      <div class="progress" role="img" aria-label="Construction progress: 72 percent">
        <div class="progress-head"><span>Progress</span><span>72%</span></div>
        <div class="bar"><i></i></div>
      </div>

    </section>

    <div class="scene" aria-hidden="true">
      <svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
        <!-- Crane tower -->
        <path class="crane" d="M300 360V44M330 360V44M300 360l30-40M330 320l-30-40M300 280l30-40M330 240l-30-40M300 200l30-40M330 160l-30-40M300 120l30-40"/>
        <!-- Jib -->
        <path class="crane" d="M90 44H370M300 44l-30-22H130M130 22L90 44"/>
        <rect class="crane-fill" x="296" y="30" width="38" height="14"/>
        <!-- Swinging load -->
        <g class="sway">
          <line class="line" x1="170" y1="44" x2="170" y2="96"/>
          <rect class="crane-fill" x="130" y="96" width="80" height="12"/>
          <path class="line" d="M170 96l-28 12M170 96l28 12"/>
        </g>

        <!-- Building floors -->
        <g>
          <g class="f f1"><rect class="floor" x="60" y="320" width="160" height="40"/><rect class="win" x="76" y="332" width="20" height="16"/><rect class="win" x="110" y="332" width="20" height="16"/><rect class="win" x="144" y="332" width="20" height="16"/><rect class="win" x="178" y="332" width="20" height="16"/></g>
          <g class="f f2"><rect class="floor" x="60" y="280" width="160" height="40"/><rect class="win" x="76" y="292" width="20" height="16"/><rect class="win" x="110" y="292" width="20" height="16"/><rect class="win" x="144" y="292" width="20" height="16"/><rect class="win" x="178" y="292" width="20" height="16"/></g>
          <g class="f f3"><rect class="floor" x="60" y="240" width="160" height="40"/><rect class="win" x="76" y="252" width="20" height="16"/><rect class="win" x="110" y="252" width="20" height="16"/><rect class="win" x="144" y="252" width="20" height="16"/><rect class="win" x="178" y="252" width="20" height="16"/></g>
          <g class="f f4"><rect class="floor" x="60" y="200" width="160" height="40"/><rect class="win" x="76" y="212" width="20" height="16"/><rect class="win" x="110" y="212" width="20" height="16"/></g>
          <g class="f f5"><path class="line" d="M60 200V160M140 200V160M220 200V160" stroke-dasharray="6 6"/><path class="line" d="M60 160H220" stroke-dasharray="6 6"/></g>
        </g>

        <!-- Ground -->
        <rect class="ground" x="20" y="360" width="360" height="10"/>
        <path d="M20 370h360" stroke="var(--yellow)" stroke-width="4" stroke-dasharray="14 10"/>
      </svg>
    </div>
  </main>

  <footer>Thanks for your patience. We'll be live soon.</footer>
  <div class="tape" aria-hidden="true"></div>
</body>
</html>
